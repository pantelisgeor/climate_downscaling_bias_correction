# exp_d02_cnn_tweedie_dwa.yml
# ──────────────────────────────────────────────────────────────────────────────
# EXPERIMENT D02 — High-resolution downscaling, Tweedie (p=1.5) + DWA
#
# Analogue of exp_13_cnn_tweedie_dwa.yml for the high-resolution dataset.
#
# Logic (same as exp_13): temperature and humidity losses converge faster
# than the tpERA Tweedie loss.  Dynamic Weight Average (DWA) automatically
# re-weights tasks based on their loss rate-of-change, boosting the gradient
# contribution from tpERA as training progresses — without any manual schedule.
#
# All hyperparameters identical to exp_d01 except:
#   loss.weighting_strategy: equal → dwa
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: "dec_downscale_tweedie_dwa"
  base_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments"
  output_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments_dec_downscale/exp_d02_dec_downscale_tweedie_dwa"
  description: "High-res decadal downscaling — Tweedie (p=1.5) + DWA task weighting"

seed: 42

data:
  data_dir:  "/nvme/h/pgeorgiades/scratch/decadal_downscale/"
  cache_dir: "/nvme/h/pgeorgiades/scratch/downscale_cache/"
  force_reindex: false
  train_years: [1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
                1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
                2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
                2010, 2011, 2012]
  val_years:  [2013, 2014, 2015, 2016]
  test_years: [2017, 2018, 2019, 2020]
  num_workers: 8

model:
  static_channels: 3
  dynamic_channels: 16
  image_size: [270, 520]
  encoder_type: "cnn"
  encoder_dim: 256
  encoder_blocks: 6
  decoder_type: "multi"
  decoder_hidden_dims: [256, 128, 64, 32]
  target_vars: ["tasERA", "tasmaxERA", "tpERA", "rhERA"]
  output_activations:
    tpERA: "softplus"
  use_film: true
  num_leads: 11
  lead_embed_dim: 128
  padding_mode: "reflect"
  dilations: [1, 2, 4, 8, 16, 1]

optimizer:
  type: "adamw"
  lr: !!float 1e-5
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  type: "cosine"
  min_lr: !!float 1e-7
  factor: 0.5
  patience: 5
  step_size: 30
  gamma: 0.1

training:
  batch_size: 24
  max_epochs: 100
  stage1_epochs: 50
  gradient_clip_val: 1.0
  early_stopping_patience: 15
  save_every_n_epochs: 5
  val_interval: 1
  use_amp: true
  device: "cuda"

loss:
  weighting_strategy: dwa          # ← KEY CHANGE vs exp_d01: DWA task weighting
  data_loss_types:
    tasERA:    hybrid
    tasmaxERA: hybrid
    tpERA:     tweedie
    rhERA:     hybrid
  tweedie_power: 1.5
  tweedie_eps: !!float 1e-6
  compositedry_gamma: 1.0
  compositedry_overestimate_weight: 2.5
  compositedry_dry_threshold: 0.002
  compositedry_lambda_extreme: 1.0
  compositedry_lambda_dry: 0.7
  wet_weight: 10.0
  dry_weight: 1.0
  use_physics: false
  physics_weight: 0.0
  use_clausius_clapeyron: false
  use_temp_consistency: false
  use_humidity_bounds: false
  use_precip_nonnegativity: false
  use_spatial_smoothness: false

logging:
  log_level: "INFO"
  log_interval: 50

evaluation:
  save_predictions: true
