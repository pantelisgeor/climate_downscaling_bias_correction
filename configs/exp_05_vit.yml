# exp_05_vit.yml
# ──────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 05 — Vision Transformer (ViT) encoder
# Purpose : Compare transformer-based encoding to the CNN baseline (exp_01).
#           ViT processes the input as non-overlapping spatial patches (7×7),
#           allowing global attention across the full 35×77 domain from layer 1.
#
# Architecture notes:
#   - vit_patch_size=7 → grid 5×11 = 55 tokens (35/7=5, 77/7=11)
#   - encoder_dim=256 (reduced from CNN's 512; ViT with 512 requires 512/8=64
#     head-dim which is fine, but smaller model trains faster for ablation)
#   - num_heads=8 → head_dim = 256/8 = 32 (valid)
#   - lr=5e-5: ViT needs slightly higher lr than CNN but lower than default
#     recommendations to avoid instability with this small domain size.
#
# Historical failures: default_ViT used lr=5e-4 + tweedie → NaN.
#                      default_ViT_relu used lr=5e-4 + tweedie → NaN.
#           This run: lr=5e-5 + wethybrid (same safe recipe as CNN runs).
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: "vit_baseline"
  base_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments"
  output_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments/exp_05_vit"
  description: "ViT encoder (patch=7, dim=256, heads=8), wethybrid, no physics — CNN vs transformer"

seed: 42

data:
  nc_path: "/nvme/h/pgeorgiades/scratch/full_dataset.nc"
  cache_dir: "./cache"
  load_in_memory: true
  rank0_only_in_memory_load: true
  rank0_batch_broadcast: false
  normalize: true
  normalize_samples: 100000
  normalize_method: "minmax"
  train_years: [1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
                1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
                2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
                2010, 2011, 2012]
  val_years: [2013, 2014, 2015, 2016]
  test_years: [2017, 2018, 2019, 2020]
  num_workers: 12

model:
  static_channels: 3
  dynamic_channels: 16
  image_size: [35, 77]
  encoder_type: "vit"
  encoder_dim: 256            # head_dim = 256/8 = 32; divisibility OK
  encoder_blocks: 8           # ViT benefits from more blocks than CNN
  decoder_type: "multi"
  decoder_hidden_dims: [512, 256, 128, 64]
  target_vars: ["tasERA", "tasmaxERA", "tpERA", "rhERA"]
  # ViT-specific parameters
  vit_patch_size: 7           # 35/7=5 rows, 77/7=11 cols → 55 tokens
  vit_num_heads: 8            # 256 / 8 = 32 per head
  vit_mlp_ratio: 4.0          # FFN width multiplier (standard is 4; 8 is large)
  vit_dropout: 0.1
  vit_attention_dropout: 0.1
  output_activations:
    tpERA: "relu"
  use_film: true
  num_leads: 11
  lead_embed_dim: 128

optimizer:
  type: "adamw"
  lr: !!float 5e-5            # conservative — default ViT recs (1e-3/1e-4) too
                              # aggressive for this tiny 35×77 domain
  weight_decay: 0.001         # slightly higher regularisation for transformer
  betas: [0.9, 0.999]

scheduler:
  type: "cosine"
  min_lr: !!float 1e-7
  factor: 0.5
  patience: 5
  step_size: 30
  gamma: 0.1

training:
  batch_size: 256
  max_epochs: 100
  stage1_epochs: 50
  gradient_clip_val: 1.0
  early_stopping_patience: 15
  save_every_n_epochs: 5
  val_interval: 1
  use_amp: true
  device: "cuda"

loss:
  weighting_strategy: equal
  data_loss_types:
    tasERA: hybrid
    tasmaxERA: hybrid
    tpERA: wethybrid
    rhERA: hybrid
  wet_weight: 5.0
  dry_weight: 1.0
  use_physics: false
  physics_weight: 0.0
  use_clausius_clapeyron: false
  use_temp_consistency: false
  use_humidity_bounds: false
  use_precip_nonnegativity: false
  use_spatial_smoothness: false

logging:
  log_level: "INFO"
  log_interval: 50

evaluation:
  save_predictions: true
