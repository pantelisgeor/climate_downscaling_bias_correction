# exp_07_cnn_precip_loss_fix.yml
# ──────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 07 — CNN baseline with corrected WetDayHybridLoss
#
# Root-cause of under-prediction in exp_01 (loss math was wrong):
#   WetDayHybridLoss previously computed:
#       loss = (wet_weight × wet_pixels + dry_weight × dry_pixels).mean()
#   The global .mean() divides by ALL pixels (wet + dry combined). With Cyprus
#   having ~85% dry days, wet_weight=5 gave wet pixels only ~47% of gradient
#   signal — scarcely better than plain hybrid loss.
#
# Fix applied to src/losses/data_losses.py:
#   Compute mean WITHIN each regime independently, then combine:
#       loss = wet_weight × mean(wet_pixels) + dry_weight × mean(dry_pixels)
#   Now wet_weight=10 truly means: every wet pixel's average error counts
#   10× the average dry pixel error, regardless of the wet/dry ratio.
#
# Changes vs exp_01:
#   - WetDayHybridLoss fix (code-level, affects all wethybrid experiments)
#   - wet_weight: 5.0 → 10.0  (stronger gradient on precipitation events)
#   - all other hyperparameters identical to exp_01
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: "cnn_precip_loss_fix"
  base_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments"
  output_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments/exp_07_cnn_precip_loss_fix"
  description: "CNN baseline with corrected per-regime WetDayHybridLoss and wet_weight=10"

seed: 42

data:
  nc_path: "/nvme/h/pgeorgiades/scratch/full_dataset.nc"
  cache_dir: "./cache"
  load_in_memory: true
  rank0_only_in_memory_load: true
  rank0_batch_broadcast: false
  normalize: true
  normalize_samples: 100000
  normalize_method: "minmax"
  train_years: [1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
                1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
                2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
                2010, 2011, 2012]
  val_years: [2013, 2014, 2015, 2016]
  test_years: [2017, 2018, 2019, 2020]
  num_workers: 12

model:
  static_channels: 3          # dem, rho, phi
  dynamic_channels: 16        # pr, tas, tasmax, hurs, sin_t, cos_t, cci×10
  image_size: [35, 77]
  encoder_type: "cnn"
  encoder_dim: 512
  encoder_blocks: 5
  decoder_type: "multi"
  decoder_hidden_dims: [512, 256, 128, 64]
  target_vars: ["tasERA", "tasmaxERA", "tpERA", "rhERA"]
  output_activations:
    tpERA: "softplus"
  use_film: true
  num_leads: 11
  lead_embed_dim: 128
  padding_mode: "reflect" 

optimizer:
  type: "adamw"
  lr: !!float 1e-5
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  type: "cosine"
  min_lr: !!float 1e-7
  factor: 0.5
  patience: 5
  step_size: 30
  gamma: 0.1

training:
  batch_size: 256
  max_epochs: 100
  stage1_epochs: 50
  gradient_clip_val: 1.0
  early_stopping_patience: 15
  save_every_n_epochs: 5
  val_interval: 1
  use_amp: true
  device: "cuda"

loss:
  weighting_strategy: equal
  data_loss_types:
    tasERA: hybrid
    tasmaxERA: hybrid
    tpERA: wethybrid           # now uses corrected per-regime averaging
    rhERA: hybrid
  # wet_weight=10 with corrected loss: each wet pixel's mean error counts 10×
  # the mean dry-pixel error — meaningful signal even at 85% dry-day frequency.
  wet_weight: 10.0
  dry_weight: 1.0
  use_physics: false
  physics_weight: 0.0
  use_clausius_clapeyron: false
  use_temp_consistency: false
  use_humidity_bounds: false
  use_precip_nonnegativity: false
  use_spatial_smoothness: false

logging:
  log_level: "INFO"
  log_interval: 50

evaluation:
  save_predictions: true
