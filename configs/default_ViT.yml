# configs/vit_config.yml - Complete ViT configuration

# Experiment configuration
experiment:
  name: "climate_net_vit"
  base_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments"

seed: 42

# Model configuration
model:
  static_channels: 3
  dynamic_channels: 16
  image_size: [35, 77]
  
  encoder_type: "vit"  # Use ViT
  encoder_dim: 512
  encoder_blocks: 6  # ViT typically needs more layers than CNN
  
  # ViT-specific parameters
  vit_patch_size: 7  # 35/7=5, 77/7=11 patches
  vit_num_heads: 8
  vit_mlp_ratio: 6.0
  vit_dropout: 0.15
  vit_attention_dropout: 0.15
  
  decoder_hidden_dims: [512, 256, 128, 64]
  target_vars: ["tasERA", "tasmaxERA", "tpERA", "rhERA"]
  
  use_film: true
  num_leads: 11
  lead_embed_dim: 256

# Optimizer configuration
optimizer:
  type: "adamw"
  lr: !!float 5e-4  # ViT needs higher LR than CNN
  weight_decay: 0.005  # Higher weight decay for ViT
  betas: [0.9, 0.999]

# Scheduler configuration
scheduler:
  type: "cosine"
  min_lr: !!float 1e-5  # Higher min LR for ViT

# Training configuration
training:
  batch_size: 350  # ViT benefits from larger batches
  max_epochs: 150  # ViT needs more epochs
  stage1_epochs: 75
  gradient_clip_val: 1.0
  early_stopping_patience: 10
  save_every_n_epochs: 5
  val_interval: 1
  use_amp: true

# Data configuration
data:
  nc_path: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models/preprocessed_data/decadal_for_training/full_dataset.nc"
  cache_dir: "./cache"
  load_in_memory: true
  normalize: true
  normalize_method: "minmax"  # "minmax" or "zscore"
  
  # Year-based splits
  train_years: [1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
                1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
                2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
                2010, 2011, 2012]
  val_years: [2013, 2014, 2015, 2016]
  test_years: [2017, 2018, 2019, 2020]
  
  num_workers: 12

# Loss configuration
loss:
  weighting_strategy: "equal"  # "equal", "uncertainty", or "gradnorm"
  physics_weight: 0.1
  use_physics: true
  # Physics loss components
  use_clausius_clapeyron: true
  use_temp_consistency: true
  use_humidity_bounds: true
  use_precip_nonnegativity: true
  use_spatial_smoothness: false

# Logging configuration
logging:
  log_level: "INFO"
  log_interval: 50

# Evaluation configuration
evaluation:
  save_predictions: false
