# exp_09_cnn_compositedry_gamma2.yml
# ──────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 09 — CompositeExtremeDryLoss with gamma=2.0 (cubic focal term)
#
# When to run: exp_08 (gamma=1.0) still under-predicts heavy-rain events.
#
# Change vs exp_08:
#   compositedry_gamma: 1.0 → 2.0
#
# Effect:
#   The focal weight becomes  error^2  (vs error^1 in exp_08), so the combined
#   loss on each pixel is  error^2 × error = error^3.  This is substantially
#   more aggressive: an error of 0.5 (normalised) gets 4× the weight it would
#   under exp_08; an error of 0.1 gets about the same.  The gradient signal
#   becomes even more dominated by the hardest (most under-predicted) examples.
#
#   Trade-off: increased risk of training instability if a few outlier pixels
#   dominate early batches — watch the tpERA loss curve for spikes.
#   gradient_clip_val=1.0 provides the safety net.
#
# All other hyperparameters identical to exp_08.
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: "cnn_compositedry_gamma2"
  base_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments"
  output_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments/exp_09_cnn_compositedry_gamma2"
  description: "CompositeExtremeDryLoss with gamma=2.0 (error³ focal) — aggressive extreme boosting"

seed: 42

data:
  nc_path: "/nvme/h/pgeorgiades/scratch/full_dataset.nc"
  cache_dir: "./cache"
  load_in_memory: true
  rank0_only_in_memory_load: true
  rank0_batch_broadcast: false
  normalize: true
  normalize_samples: 100000
  normalize_method: "minmax"
  train_years: [1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
                1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
                2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
                2010, 2011, 2012]
  val_years: [2013, 2014, 2015, 2016]
  test_years: [2017, 2018, 2019, 2020]
  num_workers: 12

model:
  static_channels: 3
  dynamic_channels: 16
  image_size: [35, 77]
  encoder_type: "cnn"
  encoder_dim: 512
  encoder_blocks: 5
  decoder_type: "multi"
  decoder_hidden_dims: [512, 256, 128, 64]
  target_vars: ["tasERA", "tasmaxERA", "tpERA", "rhERA"]
  output_activations:
    tpERA: "softplus"
  use_film: true
  num_leads: 11
  lead_embed_dim: 128

optimizer:
  type: "adamw"
  lr: !!float 1e-5
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  type: "cosine"
  min_lr: !!float 1e-7
  factor: 0.5
  patience: 5
  step_size: 30
  gamma: 0.1

training:
  batch_size: 256
  max_epochs: 100
  stage1_epochs: 50
  gradient_clip_val: 1.0
  early_stopping_patience: 15
  save_every_n_epochs: 5
  val_interval: 1
  use_amp: true
  device: "cuda"

loss:
  weighting_strategy: equal
  data_loss_types:
    tasERA: hybrid
    tasmaxERA: hybrid
    tpERA: compositedry
    rhERA: hybrid
  compositedry_gamma: 2.0                # ← KEY CHANGE: error³ focal (was 1.0 in exp_08)
  compositedry_overestimate_weight: 2.5
  compositedry_dry_threshold: 0.002
  compositedry_lambda_extreme: 1.0
  compositedry_lambda_dry: 0.7           # same dry penalty as exp_08
  wet_weight: 10.0
  dry_weight: 1.0
  use_physics: false
  physics_weight: 0.0
  use_clausius_clapeyron: false
  use_temp_consistency: false
  use_humidity_bounds: false
  use_precip_nonnegativity: false
  use_spatial_smoothness: false

logging:
  log_level: "INFO"
  log_interval: 50

evaluation:
  save_predictions: true
