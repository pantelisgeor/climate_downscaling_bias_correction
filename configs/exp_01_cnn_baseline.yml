# exp_01_cnn_baseline.yml
# ──────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 01 — CNN baseline (control)
# Purpose : Stable anchor for all subsequent ablations. No physics losses.
#            Only the data-loss bug-fixes: relu on tpERA, wethybrid for precip.
# Changes vs historical runs:
#   - output_activations.tpERA = relu   (was missing → negative precip)
#   - tpERA loss = wethybrid            (was tweedie → NaN with AMP)
#   - wet_weight = 5.0 / dry_weight=1.0 (new: weights wet-day pixels 5×)
#   - physics OFF                       (isolate data-loss behaviour first)
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: "cnn_baseline"
  base_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments"
  output_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments/exp_01_cnn_baseline"
  description: "CNN multi-decoder, wethybrid precip loss, no physics — control run"

seed: 42

data:
  nc_path: "/nvme/h/pgeorgiades/scratch/full_dataset.nc"
  cache_dir: "./cache"
  load_in_memory: true
  rank0_only_in_memory_load: true
  rank0_batch_broadcast: false
  normalize: true
  normalize_samples: 100000
  normalize_method: "minmax"
  train_years: [1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
                1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
                2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
                2010, 2011, 2012]
  val_years: [2013, 2014, 2015, 2016]
  test_years: [2017, 2018, 2019, 2020]
  num_workers: 12

model:
  static_channels: 3          # dem, rho, phi
  dynamic_channels: 16        # pr, tas, tasmax, hurs, sin_t, cos_t, cci×10
  image_size: [35, 77]
  encoder_type: "cnn"
  encoder_dim: 512
  encoder_blocks: 5
  decoder_type: "multi"       # independent head per target variable
  decoder_hidden_dims: [512, 256, 128, 64]
  target_vars: ["tasERA", "tasmaxERA", "tpERA", "rhERA"]
  output_activations:
    tpERA: "relu"             # enforce non-negativity in normalised space
  use_film: true
  num_leads: 11               # lead times 0-10
  lead_embed_dim: 128

optimizer:
  type: "adamw"
  lr: !!float 1e-5            # safe LR — 5e-5/1e-4 caused NaN in historical runs
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  type: "cosine"
  min_lr: !!float 1e-7
  factor: 0.5
  patience: 5
  step_size: 30
  gamma: 0.1

training:
  batch_size: 200
  max_epochs: 100
  stage1_epochs: 50           # epochs 1-50 data-loss only; 51-100 adds physics
  gradient_clip_val: 1.0
  early_stopping_patience: 15
  save_every_n_epochs: 5
  val_interval: 1
  use_amp: true
  device: "cuda"

loss:
  weighting_strategy: equal
  data_loss_types:
    tasERA: hybrid             # 0.7×MSE + 0.3×MAE
    tasmaxERA: hybrid
    tpERA: wethybrid           # hybrid with wet-pixel up-weighting
    rhERA: hybrid
  wet_weight: 5.0              # wet-day pixel weight in wethybrid
  dry_weight: 1.0              # dry-day pixel weight in wethybrid
  # Physics constraints all OFF in this experiment
  use_physics: false
  physics_weight: 0.0
  use_clausius_clapeyron: false
  use_temp_consistency: false
  use_humidity_bounds: false
  use_precip_nonnegativity: false  # always zero when relu is active; skip
  use_spatial_smoothness: false

logging:
  log_level: "INFO"
  log_interval: 50

evaluation:
  save_predictions: true
