# Experiment configuration
experiment:
  name: "climate_net_baseline"
  base_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments"
  output_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments/climate_net_baseline_default_5"
  description: "Baseline ClimateNet model with CNN encoder"

# Random seed
seed: 42

# Data configuration
data:
  nc_path: "/nvme/h/pgeorgiades/scratch/full_dataset.nc"
  cache_dir: "./cache"
  load_in_memory: true
  rank0_only_in_memory_load: true
  rank0_batch_broadcast: false
  normalize: true
  normalize_samples: 80000
  normalize_method: "minmax"  # "minmax" or "zscore"
  
  # Year-based splits
  train_years: [1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
                1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
                2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
                2010, 2011, 2012]
  val_years: [2013, 2014, 2015, 2016]
  test_years: [2017, 2018, 2019, 2020]
  
  num_workers: 12
model:
  static_channels: 3
  dynamic_channels: 16
  image_size:
  - 35
  - 77
  encoder_type: cnn
  encoder_dim: 512
  encoder_blocks: 5
  decoder_hidden_dims:
  - 512
  - 256
  - 128
  - 64
  target_vars:
  - tasERA
  - tasmaxERA
  - tpERA
  - rhERA
  use_film: true
  num_leads: 11
  lead_embed_dim: 128
loss:
  weighting_strategy: equal
  data_loss_types:
    tasERA: mse
    tasmaxERA: mse
    tpERA: mae
    rhERA: mse
  tweedie_power: 1.6
  tweedie_eps: 1.0e-6
  physics_weight: 0.1
  use_physics: true
  use_clausius_clapeyron: true
  use_temp_consistency: true
  use_humidity_bounds: true
  use_precip_nonnegativity: true
  use_spatial_smoothness: false
  precip_nonneg_weight: 0.05
optimizer:
  type: adamw
  lr: 0.00001
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
  momentum: 0.9
scheduler:
  type: cosine
  min_lr: 0.0000001
  factor: 0.5
  patience: 5
  step_size: 30
  gamma: 0.1
training:
  batch_size: 245
  max_epochs: 100
  stage1_epochs: 50
  gradient_clip_val: 1.0
  early_stopping_patience: 10
  save_every_n_epochs: 5
  val_interval: 1
  use_amp: true
  device: cuda
logging:
  log_level: INFO
  log_interval: 50
evaluation:
  save_predictions: true
