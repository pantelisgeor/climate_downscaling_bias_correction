# exp_08_cnn_compositedry_loss.yml
# ──────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 08 — CNN baseline with CompositeExtremeDryLoss for tpERA
#
# Motivation — why exp_07 (WetDayHybridLoss) still under-predicts:
#   1. MSE dominance (alpha=0.7): The MSE-optimal prediction is the conditional
#      mean E[Y|X]. For heavy-tailed precipitation distributions this is well
#      below typical wet-event magnitudes and far below extremes.  Increasing
#      wet_weight scales the gradient but does NOT change what MSE minimises.
#   2. Symmetric loss: MSE and MAE penalise under- and over-prediction equally.
#      For precipitation we need asymmetric treatment:
#        • Under-predictions of heavy rain → need amplified gradient
#        • Over-predictions of dry days   → need extra penalty to suppress
#          spurious drizzle
#
# CompositeExtremeDryLoss addresses both problems:
#   • Base = MAE (not MSE). MAE's optimal prediction is the conditional median,
#     which is closer to actual precipitation intensity than the mean.
#   • Focal term: weight = error^gamma_precip.  With gamma_precip=1.0 the loss
#     becomes error^2 for large errors — hard examples (extreme under-predictions)
#     get disproportionately large gradient, directly pushing the network toward
#     predicting heavier events.
#   • Dry asymmetric penalty: over-predicting precipitation on dry days is
#     penalised by overestimate_weight × MAE independently of the focal term.
#     This suppresses false drizzle without hurting wet-day learning.
#
# Other changes vs exp_07:
#   - tpERA loss: wethybrid → compositedry
#   - All other hyperparameters identical to exp_07
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: "cnn_compositedry_loss"
  base_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments"
  output_dir: "/nvme/h/pgeorgiades/data_p185/AI_downscale/NEW_models_2/experiments/exp_08_cnn_compositedry_loss"
  description: "CNN baseline with CompositeExtremeDryLoss (focal MAE + dry penalty) for tpERA"

seed: 42

data:
  nc_path: "/nvme/h/pgeorgiades/scratch/full_dataset.nc"
  cache_dir: "./cache"
  load_in_memory: true
  rank0_only_in_memory_load: true
  rank0_batch_broadcast: false
  normalize: true
  normalize_samples: 100000
  normalize_method: "minmax"
  train_years: [1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989,
                1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999,
                2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
                2010, 2011, 2012]
  val_years: [2013, 2014, 2015, 2016]
  test_years: [2017, 2018, 2019, 2020]
  num_workers: 12

model:
  static_channels: 3          # dem, rho, phi
  dynamic_channels: 16        # pr, tas, tasmax, hurs, sin_t, cos_t, cci×10
  image_size: [35, 77]
  encoder_type: "cnn"
  encoder_dim: 512
  encoder_blocks: 5
  decoder_type: "multi"
  decoder_hidden_dims: [512, 256, 128, 64]
  target_vars: ["tasERA", "tasmaxERA", "tpERA", "rhERA"]
  output_activations:
    tpERA: "softplus"
  use_film: true
  num_leads: 11
  lead_embed_dim: 128

optimizer:
  type: "adamw"
  lr: !!float 1e-5
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  type: "cosine"
  min_lr: !!float 1e-7
  factor: 0.5
  patience: 5
  step_size: 30
  gamma: 0.1

training:
  batch_size: 256
  max_epochs: 100
  stage1_epochs: 50
  gradient_clip_val: 1.0
  early_stopping_patience: 15
  save_every_n_epochs: 5
  val_interval: 1
  use_amp: true
  device: "cuda"

loss:
  weighting_strategy: equal
  data_loss_types:
    tasERA: hybrid
    tasmaxERA: hybrid
    tpERA: compositedry          # Focal MAE + asymmetric dry penalty
    rhERA: hybrid
  # CompositeExtremeDryLoss params for tpERA
  compositedry_gamma: 1.0                # focal exponent: 0=MAE, 1=error², 2=error³
  compositedry_overestimate_weight: 2.5  # penalty multiplier for dry-day over-predictions
  compositedry_dry_threshold: 0.002      # denorm threshold: below = dry (~0 mm/day)
  compositedry_lambda_extreme: 1.0       # weight of focal term
  compositedry_lambda_dry: 0.7           # weight of dry penalty term
  # wethybrid params kept but unused (tpERA uses compositedry)
  wet_weight: 10.0
  dry_weight: 1.0
  use_physics: false
  physics_weight: 0.0
  use_clausius_clapeyron: false
  use_temp_consistency: false
  use_humidity_bounds: false
  use_precip_nonnegativity: false
  use_spatial_smoothness: false

logging:
  log_level: "INFO"
  log_interval: 50

evaluation:
  save_predictions: true
